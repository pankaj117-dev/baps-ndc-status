name: Ingest weekly updates

on:
  schedule:
    # 12:00 UTC, weekdays — adjust to whenever suits your meeting cadence.
    - cron: "0 12 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ingest open weekly-update / feedback issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ingest.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "baps-ndc-status-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "chore: ingest weekly updates [skip ci]"
            git push
          else
            echo "no changes to commit"
          fi
