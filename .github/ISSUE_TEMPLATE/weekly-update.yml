name: "Weekly Project Update"
description: "Submit your project's status for this week's NDC review. This gets pulled into the dashboard automatically."
title: "[Weekly Update] "
labels: ["weekly-update"]
body:
  - type: markdown
    attributes:
      value: |
        Fill in what's changed this week. Leave a field blank to keep last week's value.
        Check the dashboard first — https://pankaj117-dev.github.io/baps-ndc-status/ — for any
        open follow-ups on your project before you submit; a bot will also remind you below once
        you open this issue.
  - type: dropdown
    id: project
    attributes:
      label: Project
      options:
        - WebNext
        - WebNext 2.0
        - Pledge – 1.0
        - Pledge - 1.x
        - EMM
        - MyBKY (Phase 1)
        - myBKY 2A
        - myMandir 1B
        - myMandir 1C
        - GMS 1.4
        - SSO V2
        - SPM
        - BKMS
        - MIS
        - mySatsang – BAPS ID Integration
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: PM name
      placeholder: "Jeet Savani"
  - type: input
    id: as_of
    attributes:
      label: As of date
      description: "Format: YYYY-MM-DD. This is the meeting date this update belongs to."
      placeholder: "2026-08-25"
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Overall status
      options:
        - Green
        - Amber
        - Red
        - Non-Recoverable
    validations:
      required: true
  - type: textarea
    id: status_change_reason
    attributes:
      label: Reason for status change
      description: >-
        ⚠️ **Required when overall status got worse** than last week (Green → Amber, Amber → Red,
        anything → Non-Recoverable, etc.). Explain what changed and why. If status did not get worse,
        leave blank. Submissions with a worse status and no reason are **not merged** until you add one.
      placeholder: "VAPT re-verification failed a second time; infra team says earliest re-slot is 2 weeks out"
  - type: input
    id: progress
    attributes:
      label: "Progress (0-100)"
      description: "Your best call on % complete toward go-live."
      placeholder: "65"
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Pipeline stage
      description: "Which canonical stage is this project in right now? Drives the Pipeline stages board on the dashboard. Leave as-is if unchanged."
      options:
        - Requirements
        - Design / Estimation
        - Development
        - QA / UAT
        - Production Release
        - Hypercare / Post-Launch
  - type: input
    id: stage_planned_start
    attributes:
      label: Current stage — planned start date
      description: >-
        Format YYYY-MM-DD. The planned/target start date for the CURRENT stage selected above. Leave
        blank to keep unchanged. The first value you submit for a given stage becomes its locked
        baseline on the dashboard's stage detail view — submitting a different date later is recorded
        as a plan revision, not a silent overwrite.
      placeholder: "2026-09-01"
  - type: input
    id: stage_planned_end
    attributes:
      label: Current stage — planned completion date
      description: "Format YYYY-MM-DD. Same rules as the planned start date above — first value is the baseline, later changes are tracked as revisions."
      placeholder: "2026-09-15"
  - type: textarea
    id: delay_log_entries
    attributes:
      label: Delay log entries (this week)
      description: >-
        Optional — only if something specifically caused lost time THIS week within the CURRENT
        stage selected above. One per line, format: `date | reason | team | person | days` — e.g.
        `2026-09-14 | Review defects resolution | Team2 | V. Mehta | 1`. These ADD to that stage's
        running delay log on the dashboard (they don't replace prior weeks' entries), and feed the
        stage detail view's Delay Analysis / Delay Log tabs. Leave blank if there's nothing to log.
      placeholder: |
        2026-09-14 | Review defects resolution | Team2 | V. Mehta | 1
        2026-09-17 | Unplanned meeting attendance | Team1 | R. Shah | 1
  - type: input
    id: phase
    attributes:
      label: Current phase
      placeholder: "Regression / Perf / UAT"
  - type: input
    id: next_milestone_name
    attributes:
      label: Next milestone name
      placeholder: "UAT"
  - type: input
    id: next_milestone_date
    attributes:
      label: Next milestone date
      description: "Format: YYYY-MM-DD"
      placeholder: "2026-09-09"
  - type: input
    id: go_live
    attributes:
      label: Go-live date
      description: "Format: YYYY-MM-DD, leave blank if not set"
      placeholder: "2026-09-25"
  - type: input
    id: delay_days
    attributes:
      label: Delay (days)
      description: "Re-enter every week — 0 if on schedule, positive if late (blank is not allowed; stale delay values mislead the dashboard)."
      placeholder: "0"
    validations:
      required: true
  - type: input
    id: delay_note
    attributes:
      label: Delay note
      placeholder: "Mobile dev delayed — may impact regression testing"
  - type: input
    id: delay_impact
    attributes:
      label: Impact of delay
      description: "⚠️ **Required when \"Delay (days)\" above is greater than 0.** Go-live slip, other teams/projects blocked, etc. Leave blank when delay is 0."
      placeholder: "Pushes go-live by 4 days; blocks MyBKY Phase 2 regression start"
  - type: textarea
    id: delay_mitigation
    attributes:
      label: Mitigation steps taken
      description: "⚠️ **Required when \"Delay (days)\" above is greater than 0.** One per line — what's already been done (or is being done) to reduce or recover the delay. Leave blank when delay is 0."
      placeholder: |
        Added a second QA resource to parallelize regression testing
        Escalated security re-verification slot with the infra team
  - type: textarea
    id: delay_tradeoffs
    attributes:
      label: Trade-off conversations
      description: "Any trade-offs discussed or decided because of this delay — cutting scope, shifting resources, accepting risk, revising the date, etc. Leave blank if none."
      placeholder: "Agreed with leadership to drop the PDF export feature from this release to hold the go-live date"
  - type: input
    id: time_saved_days
    attributes:
      label: Time saved this week (days)
      description: "Went the other way? If the team pulled time back IN this week, how many days ahead of plan did that put you? Leave blank/0 if none."
      placeholder: "2"
  - type: textarea
    id: time_saved_note
    attributes:
      label: What did the team do to save that time?
      description: "⚠️ **Required when \"Time saved this week (days)\" above is greater than 0.** One per line — what specifically got faster, parallelized, automated, or cut. Leave blank when time saved is 0 or empty."
      placeholder: |
        Automated the regression suite instead of running it manually
        Parallelized mobile + web QA instead of doing them sequentially
  - type: dropdown
    id: scope_reduced
    attributes:
      label: Reducing scope to hold the date?
      description: "Are you cutting/deferring any scope this week to keep the current go-live? If Yes, list what's being deferred in 'Fast-follow items' below so it's tracked and doesn't get lost after launch."
      options:
        - "No"
        - "Yes"
      default: 0
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: >-
        One line per **open** dependency (same order for all dependency fields below).
        **New** dependencies mid-week? Use the **Add a Dependency** issue form instead —
        they'll show up here automatically on the dashboard. To edit an existing row, keep
        the same line order as last week (stable `DEP-*` ids are assigned in the background).
        Optional: prefix a line with `DEP-101 |` if you need to tie it to a specific id.
        Include ticket links where you can.
      placeholder: |
        DEVOPS-1082 — SPM production environment setup
        Waiting on Sameep for REQ doc review
  - type: textarea
    id: dependency_team
    attributes:
      label: Dependency owning team(s)
      description: "⚠️ **Required for each dependency listed above** — one line per dependency, **same order**. Who owns unblocking (e.g. DevOps, Security, Business/Stakeholder)? Feeds the Dependencies tab. Leave blank if you listed no dependencies this week."
      placeholder: |
        DevOps
        Business/Stakeholder (Sameep)
  - type: textarea
    id: dependency_mitigation
    attributes:
      label: Dependency mitigation plan / impact
      description: "⚠️ **Required for each dependency listed above** — one line per dependency, **same order**. Plan to unblock and impact if not resolved in time. Leave blank if you listed no dependencies this week."
      placeholder: |
        Escalated to DevOps lead, ETA 22-Aug — if missed, UAT start slips by same amount
        Following up with Sameep directly — no fallback reviewer identified yet
  - type: textarea
    id: dependency_due_by
    attributes:
      label: Dependency needed by (date)
      description: "One per line, in the SAME ORDER as the dependencies above — format YYYY-MM-DD. When do you actually need this resolved by? Drives the 'due this week / next week' view on the Dependencies tab. Leave a line blank (just a dash) if that one has no hard date."
      placeholder: |
        2026-10-05
        -
  - type: textarea
    id: dependency_priority
    attributes:
      label: Dependency priority
      description: "One per line, in the SAME ORDER as the dependencies above — Critical / High / Medium / Low. Leave blank (defaults to Medium) if unsure."
      placeholder: |
        Critical
        High
  - type: textarea
    id: dependency_escalated
    attributes:
      label: Dependency escalated to leadership?
      description: >-
        One per line, in the SAME ORDER as the dependencies above — Yes / No (or leave blank = No).
        Has this specific dependency ALSO been escalated to leadership as a blocker? This is separate
        from the general "Escalations to leadership this week" list below; use this only to flag
        individual dependencies that leadership is already involved on.
      placeholder: |
        Yes
        No
  - type: textarea
    id: dependency_resolved
    attributes:
      label: Dependency resolved?
      description: >-
        One per line, in the SAME ORDER as the open dependencies above — Yes / No (or leave blank = No).
        Mark Yes when a dependency is unblocked; it drops off the Dependencies tab but stays in history.
        **Or** simply omit a resolved dependency from the Dependencies list above — that also marks it
        resolved.
      placeholder: |
        No
        Yes
  - type: textarea
    id: completed
    attributes:
      label: Completed this week
      description: "One per line"
    validations:
      required: true
  - type: textarea
    id: in_progress
    attributes:
      label: In progress
      description: "One per line"
    validations:
      required: true
  - type: textarea
    id: next_plan
    attributes:
      label: Next plan
      description: "One per line"
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks / blockers
      description: "One per line"
  - type: textarea
    id: risk_mitigation
    attributes:
      label: Risk mitigation plan
      description: "⚠️ **Required for each risk listed above** — one line per risk, **same order**. What's being done and what's the impact if it isn't mitigated? Leave blank if you listed no risks this week."
      placeholder: |
        Adding load-balancing config before next test cycle — if unresolved, go-live may slip 1 week
        Escalated to security team for re-verification — no impact to current timeline yet
  - type: textarea
    id: fast_follow
    attributes:
      label: Fast-follow items (planned or remaining)
      description: >-
        Everything that's being deferred past go-live — whether that's scope you're cutting now to
        hold the date (see "Reducing scope?" above) or, once live, what's still left to deliver
        before the project can be marked fully done. One per line — this shows up as its own
        tracked section on the project's dashboard view so it's not forgotten after launch.
        Leave blank once nothing remains.
      placeholder: |
        Add bulk-export button to admin console
        Migrate legacy reports to new schema
  - type: textarea
    id: escalations
    attributes:
      label: Escalations to leadership this week
      description: >-
        Anything that needs a leadership decision, unblock, or heads-up this sprint — separate from
        the general risks/blockers above. One per line. This shows up on the dashboard's Escalations
        tab and rolls up across every project so it's easy to walk through in the review meeting.
        Leave blank if there's nothing to escalate this week.
      placeholder: |
        Need a go/no-go decision on cutting the PDF export feature to hold the go-live date
        Security re-verification slot is 2 weeks out — need help getting it expedited
